
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b24">
<title>AquaControl</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101b24;color:#eef6f8;font-family:Arial,sans-serif}
header{background:#172833;padding:20px;position:sticky;top:0}
h1{margin:0;color:#54d6b0}
main{max-width:700px;margin:auto;padding:14px}
.card{background:#1b2a35;border:1px solid #304451;border-radius:14px;padding:16px;margin:12px 0}
label{display:block;color:#b7c6ce;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #405560;background:#10202a;color:white;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px 16px;border:0;border-radius:10px;background:#54d6b0;color:#08251e;font-weight:bold;margin:5px 3px}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tabs button{background:#304653;color:white}
.tabs button.active{background:#54d6b0;color:#08251e}
.entry{border-top:1px solid #405560;padding:12px 0}
small,.muted{color:#a9bac5}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🐠 AquaControl</h1>
<p>Akvarisztikai napló</p>
</header>
<main>
<div class="tabs">
<button class="active" onclick="show('measure',this)">Mérés</button>
<button onclick="show('history',this)">Napló</button>
<button onclick="show('backup',this)">Mentés</button>
</div>

<section id="measure">
<div class="card">
<h2>Új mérés</h2>
<label>Akvárium</label>
<select id="tank">
<option>1-es akva</option>
<option>2-es akva – Zsani</option>
</select>
<div class="grid">
<div><label>NO3 (mg/l)</label><input id="no3" type="number" step="any"></div>
<div><label>PO4 (mg/l)</label><input id="po4" type="number" step="any"></div>
<div><label>NH4 (mg/l)</label><input id="nh4" type="number" step="any"></div>
<div><label>NO2 (mg/l)</label><input id="no2" type="number" step="any"></div>
<div><label>pH</label><input id="ph" type="number" step="any"></div>
<div><label>KH</label><input id="kh" type="number" step="any"></div>
<div><label>GH</label><input id="gh" type="number" step="any"></div>
<div><label>Hőmérséklet °C</label><input id="temp" type="number" step="any"></div>
</div>
<label>Mérési fotó</label>
<input id="photo" type="file" accept="image/*" capture="environment">
<p class="muted">A fotó csatolható, az értékeket egyelőre kézzel kell beírni.</p>
<label>Megjegyzés</label>
<textarea id="note"></textarea>
<button onclick="saveMeasurement()">Mérés mentése</button>
</div>

<div class="card">
<h2>Vízcsere rögzítése</h2>
<label>Akvárium</label>
<select id="wtank">
<option>1-es akva</option>
<option>2-es akva – Zsani</option>
</select>
<label>Cserélt víz (liter)</label>
<input id="litres" type="number" step="any">
<label>Megjegyzés</label>
<input id="wnote">
<button onclick="saveWater()">Vízcsere mentése</button>
</div>
</section>

<section id="history" class="hidden">
<div class="card">
<h2>Korábbi bejegyzések</h2>
<div id="entries"></div>
</div>
</section>

<section id="backup" class="hidden">
<div class="card">
<h2>Biztonsági mentés</h2>
<p class="muted">Az adatok ezen a telefonon, ebben a böngészőben tárolódnak.</p>
<button onclick="exportData()">Adatok exportálása</button>
<label>Mentés visszatöltése</label>
<input id="importFile" type="file" accept="application/json">
<button onclick="importData()">Visszatöltés</button>
</div>
</section>
</main>

<script>
const KEY="aquacontrol-data";
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
function show(id,button){
document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
$(id).classList.remove("hidden");
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
if(id==="history")render();
}
function readPhoto(){
return new Promise((resolve,reject)=>{
const f=$("photo").files[0];
if(!f)return resolve("");
if(f.size>1000000)return reject(Error("A fotó maximum 1 MB lehet."));
const r=new FileReader();
r.onload=()=>resolve(r.result);
r.onerror=reject;
r.readAsDataURL(f);
});
}
async function saveMeasurement(){
try{
let values={};
["no3","po4","nh4","no2","ph","kh","gh","temp"].forEach(k=>{
if($(k).value!=="")values[k]=$(k).value;
});
let photo=await readPhoto();
if(!Object.keys(values).length&&!$("note").value&&!photo){
alert("Adj meg legalább egy mérési adatot!");
return;
}
entries.unshift({
type:"Mérés",
tank:$("tank").value,
date:new Date().toISOString(),
values,
note:$("note").value,
photo
});
persist();
["no3","po4","nh4","no2","ph","kh","gh","temp","note","photo"].forEach(k=>$(k).value="");
alert("Mérés sikeresen elmentve!");
}catch(e){alert(e.message)}
}
function saveWater(){
let litres=Number($("litres").value);
if(litres<=0){alert("Add meg a vízcsere mennyiségét!");return}
entries.unshift({
type:"Vízcsere",
tank:$("wtank").value,
date:new Date().toISOString(),
litres,
note:$("wnote").value
});
persist();
$("litres").value="";
$("wnote").value="";
alert("Vízcsere elmentve!");
}
function escapeHtml(s){
return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
let host=$("entries");
host.innerHTML="";
if(!entries.length){host.textContent="Még nincs bejegyzés.";return}
entries.forEach((e,i)=>{
let d=document.createElement("div");
d.className="entry";
let values=e.type==="Mérés"
?Object.entries(e.values).map(([k,v])=>k.toUpperCase()+": "+v).join(" • ")
:"Vízcsere: "+e.litres+" liter";
d.innerHTML="<small>"+new Date(e.date).toLocaleString("hu-HU")+" • "+escapeHtml(e.tank)+"</small><p><b>"+e.type+"</b></p><p>"+escapeHtml(values)+"</p><p>"+escapeHtml(e.note)+"</p>";
if(e.photo){
let img=document.createElement("img");
img.src=e.photo;
img.style="max-width:100%;max-height:200px;border-radius:8px";
d.appendChild(img);
}
let del=document.createElement("button");
del.textContent="Törlés";
del.onclick=()=>{
if(confirm("Törlöd ezt a bejegyzést?")){
entries.splice(i,1);persist();render();
}
};
d.appendChild(del);
host.appendChild(d);
});
}
function exportData(){
let a=document.createElement("a");
let url=URL.createObjectURL(new Blob([JSON.stringify(entries,null,2)],{type:"application/json"}));
a.href=url;a.download="aquacontrol-mentes.json";a.click();
URL.revokeObjectURL(url);
}
function importData(){
let f=$("importFile").files[0];
if(!f){alert("Válassz ki egy mentésfájlt!");return}
f.text().then(t=>{
try{
let data=JSON.parse(t);
if(!Array.isArray(data))throw Error();
if(confirm("A visszatöltés lecseréli a jelenlegi naplót. Folytatod?")){
entries=data;persist();alert("Mentés visszatöltve!");
}
}catch(e){alert("Hibás mentésfájl!")}
});
}
</script>
</body>
</html>
